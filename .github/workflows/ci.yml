name: CI/CD Pipeline & Automated Verification

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: requirements_wizard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify Code Quality & ESLint
        run: npm run lint

      - name: Run Cumulative SDAD Automated Verification (303 Assertions)
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/requirements_wizard
        run: |
          npm test

      - name: Compile Next.js Production Build
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/requirements_wizard
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  docker-build:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: test-and-verify

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: deshiklab/requirements-wizard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
